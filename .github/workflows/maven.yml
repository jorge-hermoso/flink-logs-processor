# Builds and tests the three parts of the repository: the Flink job, the log generator and the
# OpenTofu template. See docs/LOCAL_DEVELOPMENT.md for running the same checks locally.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  job:
    name: Flink job
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        # Managed Service for Apache Flink runs Java 17
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build and test
      run: mvn -B package --file pom.xml
    - name: Upload application JAR
      uses: actions/upload-artifact@v4
      with:
        name: application-jar
        path: target/flink_logs_processor_*.jar
        if-no-files-found: error

  dependency-graph:
    name: Dependency graph
    # Uploads the Maven dependency graph to GitHub for Dependabot alerts
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

  generator:
    name: Log generator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: log-generator
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Test
      run: python -m unittest discover -s tests -v
    - name: Build image
      run: docker build -t zorblatt-loggen .

  infrastructure:
    name: OpenTofu template
    runs-on: ubuntu-latest
    needs: job
    defaults:
      run:
        working-directory: deploy/tofu
    steps:
    - uses: actions/checkout@v4
    - uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: 1.10.6
    - name: Download application JAR
      uses: actions/download-artifact@v4
      with:
        name: application-jar
        path: target
    - name: Format
      run: tofu fmt -check -recursive
    - name: Validate and test (mocked AWS provider)
      run: |
        tofu init -backend=false -input=false
        tofu validate
        tofu test
