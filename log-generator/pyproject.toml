[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zorblatt-loggen"
version = "1.0.0"
description = "Synthetic unstructured production logs, with labelled anomalies, for testing the log anomaly detector"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
kinesis = ["boto3>=1.34"]

[project.scripts]
loggen = "loggen.__main__:main"

[tool.setuptools]
packages = ["loggen"]
